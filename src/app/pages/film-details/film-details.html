@if (film) {
  <div class="details">
    <img [src]="film.posterUrl" [alt]="film.title" class="details-img">
    <div class="details-content">
      <button routerLink="/" class="details-button">← Go back</button>
      <h2 class="details-title">{{ film.title }}</h2>
      <p class="details-rating">⭐ {{ film.rating }}</p>
      <p><span class="details-subtitle">Release year:</span> {{ film.year }}</p>
      <p><span class="details-subtitle">Genre:</span> {{ film.genre }}</p>
      <p><span class="details-subtitle">Duration:</span> {{ film.duration | duration }}</p>
      <p class="details-text">{{ film.description }}</p>
    </div>
  </div>
}

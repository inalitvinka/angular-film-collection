<li class="film-card" (click)="goToDetails()">
  <img [src]="film().posterUrl" [alt]="film().title" class="film-img">

  <h3>{{ film().title }}</h3>
  <p>{{ film().year }}</p>
  <p>{{ film().genre }}</p>
  <p>{{ film().rating }}</p>

  <button (click)="onFavoriteClick($event)" class="film-button">
    {{ film().isFavorite ? 'Remove from favorites' : 'Add to favorites' }}
  </button>
</li>
